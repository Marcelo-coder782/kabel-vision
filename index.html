function ovClose(){lm=false;camOff();$("#ov").hidden=true;$("#lv").getContext("2d").clearRect(0,0,9999,9999)}
function grab(){return new Promise(res=>{ovOpen("Enquadre e toque em Capturar (o app escolhe o quadro mais nítido).");camOn();
$("#bc").onclick=async()=>{const c=await bestF();ovClose();res(c)};$("#bx").onclick=()=>{ovClose();res(null)};$("#gf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const c=await load(f);ovClose();res(c)}})}
const cam=t=>`<button class="b" style="margin-top:10px" onclick="go1()">${t}</button>`;
function vI(){if(!sel&&S.recipes[0])sel=S.recipes[0].id;
const o=S.recipes.map(r=>`<option value="${r.id}"${r.id==sel?" selected":""}>${esc(r.name)} (${r.rois.length} ROIs)</option>`).join("");
return `<div class="c"><label>Modelo de inspeção (código do chicote)</label><select onchange="sel=this.value">${o||'<option value="">Nenhum modelo criado</option>'}</select><button class="b" style="margin-top:10px" onclick="liveInsp()">▶ Inspeção contínua (aprovação automática)</button><button class="g" style="width:100%;margin-top:8px" onclick="go1()">📷 Capturar foto única</button></div>${last?resH():""}`}
function resH(){const L=last,bad=L.dg.filter(x=>x.s!="ok"),tx={ok:"CONFORME",no:"NÃO CONFORME (NC)",inc:"INDETERMINADO · tratado como NC"}[L.f],lv=Math.min(...L.r.rois.map(lvl)),pd=n=>String(n+1).padStart(2,"0");
const bl=L.bl<.4?`<div class="it wa"><div class="nm">Qualidade de imagem</div><div>Nitidez relativa = ${f2(L.bl)} (< 0,40 da referência): imagem desfocada</div><div class="ac">→ Refazer a captura com foco e iluminação adequados</div></div>`:"";
const dgH=bad.length||bl?`<div class="c"><b>Análise de não conformidades: ${bad.length} ${bad.length==1?"NC":"NCs"}</b>${bl}${bad.map(x=>`<div class="it ${x.s=="no"?"nc":"wa"}"><div class="nm">NC-${pd(x.i)} · ${esc(x.n)} <span class="mu">(${x.k})</span></div><div>${x.t}</div><div class="mu">Referência ${sw(x.A.rgb)} · encontrado ${sw(x.B.rgb)}${x.ncc!==null?" · NCC "+f2(x.ncc):""} · similaridade ${Math.round(x.sim*100)}%</div><div class="ac">→ Ação corretiva: ${x.a}</div><div class="cmp"><figure><img src="${x.ex}" alt="">Referência (OK)</figure><figure><img src="${x.fo}" alt="">Encontrado</figure></div></div>`).join("")}${cam("📷 Reinspecionar após ação corretiva")}</div>`:`<div class="c"><b>Análise de não conformidades: nenhuma NC</b><div class="mu">Todas as ROIs conformes com a referência.</div></div>`;
return `<div class="c"><div class="rs ${col(L.f)}">${tx}</div><div class="mu">Sinal ao WinTestEm: <b>${L.f=="ok"?"LIBERADO":"BLOQUEADO"}</b> · ${lvN[lv]}${lv<3?" (modelo em maturação: resultado indicativo)":""}</div><button class="g" style="margin-top:8px" onclick="last=null;R()">Descartar esta captura</button></div>${dgH}<div class="c"><canvas id="cv"></canvas>${L.dg.map(x=>`<div class="row"><span class="dot ${col(x.s)}"></span><span style="flex:1">ROI ${pd(x.i)} · ${esc(x.n)} <span class="mu">${x.s=="ok"?"conforme":x.k} · similaridade ${Math.round(x.sim*100)}%</span></span></div>`).join("")}</div>
<details class="c"><summary>Treinamento supervisionado: rotular amostras desta captura</summary>${L.dg.map(x=>`<div class="row"><span style="flex:1">ROI ${pd(x.i)} · ${esc(x.n)}<div class="mu">n_OK = ${L.r.rois[x.i].ok.length} · n_NOK = ${L.r.rois[x.i].no.length} · acurácia LOO ${accTxt(L.r.rois[x.i])}</div></span><button class="g" onclick="teach('ok',${x.i})">Rotular OK</button><button class="g" onclick="teach('no',${x.i})">Rotular NOK</button></div>`).join("")}<button class="g" style="width:100%;margin-top:8px" onclick="teach('ok')">Rotular todas as ROIs como OK</button><div id="tm" class="mu" style="margin-top:8px"></div></details>`}
async function analyze(c,r,op={}){const rc=op.rc||await fromURL(r.ref),gt=gray(c,200),gr=op.gr||gray(rc,200),bl=sharp(gt)/(sharp(gr)||1),res=judge(c,r,gt,gr,bl);
for(let i=0;i<res.length;i++){const ro=r.rois[i],q=res[i];if(ro.tp!="ocr"||!ro.tx||(q.ncc!==null&&q.ncc<q.thr))continue;let txt;
try{txt=await ocr(c,q.box)}catch(e){q.oc={k:"OCR indisponível",t:"Motor OCR indisponível (requer internet na primeira carga)",a:"Conectar à internet uma vez para carregar o motor OCR; conferir visualmente"};q.s="inc";continue}
const e=nz(ro.tx),g=nz(txt),d=e&&g.includes(e)?0:lev(e,g),fi=fold(g).includes(fold(e));
if(d==0){q.s="ok";q.sim=1;q.oc={k:"Conforme",t:`Texto conforme (OCR): “${ro.tx}”`,a:""}}
else if(fi||d<=1){q.s="inc";q.oc={k:"Leitura OCR inconclusiva",t:`Leitura OCR inconclusiva: esperado “${ro.tx}”, lido “${g||"—"}” (distância de Levenshtein = ${d})`,a:"Aproximar a câmera, estabilizar e repetir a leitura; persistindo, conferir visualmente"}}
else{q.s="no";q.sim=0;q.oc={k:"Divergência de texto (OCR)",t:`Divergência de texto (OCR): esperado “${ro.tx}”, lido “${g||"—"}” (distância de Levenshtein = ${d})`,a:"Conferir se a etiqueta ou identificação corresponde ao especificado"}}}
const dg=diag(c,rc,r,res),f0=res.some(x=>x.s=="no")?"no":res.some(x=>x.s=="inc")?"inc":"ok";return{c,r,res,dg,f:bl<.4&&f0=="ok"?"inc":f0,bl,rc}}
function fill(A){A.dg.forEach(d=>{if(d.s!="ok"&&!d.ex){d.ex=crop(A.rc,A.r.rois[d.i]);d.fo=crop(A.c,d.box)}})}
function commit(A,silent){fill(A);last=A;S.log.unshift({t:Date.now(),n:A.r.name,f:A.f,th:thumb(A.c),d:(A.bl<.4?"Imagem desfocada; ":"")+A.dg.filter(x=>x.s!="ok").map(x=>x.n+" ("+x.k+")").join("; ")+(silent?" [auto]":"")});S.log=S.log.slice(0,80);save();if(!silent){say("");R();scrollTo(0,0);try{if(A.f!="ok")navigator.vibrate([250,120,250])}catch(e){}}}
const curR=()=>S.recipes.find(x=>x.id==sel);
async function go1(){const r=curR();if(!r||!r.rois.length){say("Selecione um modelo com ROIs definidas.");return}const c=await grab();if(!c)return;say("Analisando…");commit(await analyze(c,r));say("")}
function drawLive(B){const v=$("#vd"),cv=$("#lv"),W=cv.width=v.clientWidth,H=cv.height=v.clientHeight,x=cv.getContext("2d"),on=Math.floor(Date.now()/450)%2;if(B.bl<.4)return;x.font="bold 14px sans-serif";
B.dg.forEach(d=>{const b=d.box,bad=d.s!="ok",cc=d.s=="ok"?"#1f9d55":d.s=="no"?"#d93025":"#e0a000";x.lineWidth=3;if(bad&&on){x.fillStyle=cc+"55";x.fillRect(b.x*W,b.y*H,b.w*W,b.h*H);x.lineWidth=6}x.strokeStyle=x.fillStyle=cc;x.strokeRect(b.x*W,b.y*H,b.w*W,b.h*H);x.fillText((bad?"NC-":"")+String(d.i+1).padStart(2,"0"),b.x*W+3,Math.max(14,b.y*H-4))})}
async function liveInsp(){const r=curR();if(!r||!r.rois.length){say("Selecione um modelo com ROIs definidas.");return}
const rc=await fromURL(r.ref),gr=gray(rc,200),ses={ok:0,nc:0};let A=null,ko=0,kb=0,lock=false,lg="",wl=null;
const ban=(cl,t,d)=>{$("#oi").innerHTML=`<div class="bn ${cl}">${t}</div><div class="bd">${d}</div><div class="mu" style="margin-top:6px">Sessão: ${ses.ok} conformes registradas · ${ses.nc} NC registradas</div>`};
ovOpen("Iniciando câmera…","Congelar e registrar");lm=true;camOn();try{wl=await navigator.wakeLock.request("screen")}catch(e){}
$("#bx").onclick=()=>ovClose();$("#bc").onclick=()=>{if(A)commit(A,0);ovClose()};
const L=setInterval(()=>{if(lm&&A)drawLive(A)},450);
while(lm){const c=snap();if(c){try{A=await analyze(c,r,{rc,gr});const bad=A.dg.filter(d=>d.s!="ok");
if(A.bl<.4){ko=0;kb++;if(kb>=3)lock=false;ban("wa","AGUARDANDO IMAGEM NÍTIDA","Estabilize o aparelho (nitidez relativa "+f2(A.bl)+" < 0,40)")}
else if(A.f=="ok"){kb=0;ko++;lg="";if(ko>=3){ban("ok","CONFORME · SINAL LIBERADO","Todas as ROIs conformes em "+ko+" quadros consecutivos."+(lock?" Registrado automaticamente.":""));if(!lock){lock=true;ses.ok++;commit(A,1);beep(880);try{navigator.vibrate(120)}catch(e){}}}else ban("wa","ANALISANDO…","Confirmando conformidade ("+ko+"/3)")}
else{ko=0;kb++;if(kb>=3)lock=false;const sg=bad.map(d=>d.i).join();ban(A.f=="no"?"no":"wa",(A.f=="no"?"NÃO CONFORME":"INDETERMINADO")+" · SINAL BLOQUEADO",bad.slice(0,4).map(d=>"<b>NC-"+String(d.i+1).padStart(2,"0")+" "+esc(d.n)+"</b>: "+d.k+" → "+d.a).join("<br>"));
if(kb>=4&&sg!=lg){lg=sg;ses.nc++;commit(A,1);beep(260,2);try{navigator.vibrate([200,100,200])}catch(e){}}}}
catch(e){ban("wa","ERRO NA ANÁLISE",esc(e.message||e))}}await new Promise(z=>setTimeout(z,100))}
clearInterval(L);try{wl&&wl.release()}catch(e){}R()}
function teach(k,i){if(!last)return;const Z=last.r.rois;Z.forEach((o,j)=>{if(i===undefined||i===j)learn(last.c,o,k,last.res[j].box)});save();const m="Amostra rotulada como "+(k=="ok"?"OK":"NOK")+". "+(i===undefined?"Modelo: "+lvN[Math.min(...Z.map(lvl))]:"ROI "+(i+1)+": acurácia LOO "+accTxt(Z[i])+" · "+lvN[lvl(Z[i])])+". Reinspecione para validar.";const tm=$("#tm");if(tm)tm.textContent=m;say(m)}
function paint(){const cv=$("#cv");if(!cv||!last)return;const c=last.c;cv.width=c.width;cv.height=c.height;const x=cv.getContext("2d"),W=c.width,H=c.height,fs=Math.max(14,W/32);let on=false;
const draw=()=>{on=!on;x.drawImage(c,0,0);x.font=`bold ${fs}px sans-serif`;last.dg.forEach(d=>{const b=d.box,bad=d.s!="ok",cc=d.s=="ok"?"#1f9d55":d.s=="no"?"#d93025":"#e0a000";x.lineWidth=Math.max(3,W/150);
if(bad&&on){x.fillStyle=cc+"55";x.fillRect(b.x*W,b.y*H,b.w*W,b.h*H);x.lineWidth=Math.max(6,W/70)}
x.strokeStyle=x.fillStyle=cc;x.strokeRect(b.x*W,b.y*H,b.w*W,b.h*H);x.fillText((bad?"NC-":"ROI ")+String(d.i+1).padStart(2,"0")+" "+d.n,b.x*W+4,Math.max(fs,b.y*H-6))})};
draw();if(last.dg.some(d=>d.s!="ok"))bt=setInterval(draw,450)}
function vR(){return `<div class="c"><label>Nova receita (código do chicote)</label><input id="nm" placeholder="Ex.: CAT-1234"><button class="b" onclick="newR()">Criar receita</button></div>`+
S.recipes.map(r=>`<div class="c row"><b style="flex:1">${esc(r.name)}</b><span class="mu">${r.rois.length} regiões</span><button class="g" onclick="edit('${r.id}')">Editar</button></div>`).join("")}
function newR(){const n=$("#nm").value.trim();if(!n){say("Informe o código do chicote.");return}const r={id:Date.now().toString(36),name:n,ref:null,rois:[],th:.1};S.recipes.push(r);sel=r.id;save();edit(r.id)}
async function edit(id){E=id;refC=null;const r=cur();if(r.ref)refC=await fromURL(r.ref);R()}
function vE(){const r=cur(),lv=r.rois.length?Math.min(...r.rois.map(lvl)):1;
const gal=(o)=>`<div class="gal"><img class="th" style="border-color:var(--ac)" src="${crop(refC,o,64,.6)}" alt="">${(o.ot||[]).map(u=>`<img class="th" style="border-color:var(--ok)" src="${u}" alt="">`).join("")}${(o.nt||[]).map(u=>`<img class="th" style="border-color:var(--no)" src="${u}" alt="">`).join("")}</div>`;
return `<div class="c"><div class="row"><b style="flex:1">${esc(r.name)}</b><button class="g" onclick="E=null;R()">Voltar</button></div>
<button class="b" onclick="setRef()">${r.ref?"🔄 Substituir imagem de referência (golden sample)":"📷 Imagem de referência (golden sample)"}</button>
${r.ref?`<p class="mu">Defina cada ROI (região de interesse) arrastando sobre a imagem. Use nomes claros: Conector principal, Fusível F12. Para etiquetas, escolha o tipo OCR.</p><canvas id="ec" style="touch-action:none"></canvas>`:""}</div>
${r.ref?`<div class="c"><b>Referências aprendidas · ${lvN[lv]}</b><p class="mu">Para subir de nível: ${nxt[lv]}. Amarelo = referência, verde = amostra OK, vermelho = NC rotulada.</p>
${r.rois.map((o,i)=>{const s=stats(refC,o);return `<div class="it" style="border-left-color:var(--ac)"><div class="row"><input value="${esc(o.n)}" onchange="cur().rois[${i}].n=this.value;save()"><button class="g" onclick="delRoi(${i})">✕</button></div>
<div class="row"><select onchange="cur().rois[${i}].tp=this.value;save();R()"><option value="vis"${o.tp!="ocr"?" selected":""}>Verificação visual</option><option value="ocr"${o.tp=="ocr"?" selected":""}>Leitura OCR (texto)</option></select></div>
${o.tp=="ocr"?`<div class="row"><input placeholder="Texto esperado" value="${esc(o.tx||"")}" onchange="cur().rois[${i}].tx=this.value;save()"><button class="g" onclick="readRef(${i})">Ler da referência</button></div>`:""}
<div class="mu">Cor de referência ${sw(s.rgb)}${cname(...s.rgb)} · n_OK = ${o.ok.length} · n_NOK = ${o.no.length} · acurácia LOO ${accTxt(o)} · ${lvN[lvl(o)]}</div>${gal(o)}<button class="g" style="margin-top:6px" onclick="resetR(${i})">Limpar aprendizado</button></div>`}).join("")||'<p class="mu">Nenhuma ROI definida.</p>'}
<button class="g" style="width:100%;margin-top:8px" onclick="addS('ok')">＋ Amostra OK (todas as ROIs conformes)</button><p class="mu">Para ensinar não conformidades (NOK), use a inspeção e rotule a ROI com NC.</p>
<label id="rl" style="margin-top:8px">Limiar de decisão τ = ${f2(r.th)} (menor = mais rigoroso)</label><input type="range" min="3" max="25" value="${Math.round(r.th*100)}" oninput="rig(this.value)"></div>`:""}
<button class="g" style="width:100%;color:var(--no)" onclick="delR()">Excluir modelo</button>`}
async function setRef(){const c=await grab();if(!c)return;const r=cur();refC=c;r.ref=c.toDataURL("image/jpeg",.8);r.rois.forEach(o=>{o.ok=[feat(c,o.x,o.y,o.w,o.h)];o.no=[];o.ot=[];o.nt=[]});save();R()}
async function addS(k){const c=await grab();if(!c)return;const r=cur(),gt=gray(c,200),gr=gray(refC,200);r.rois.forEach(o=>learn(c,o,k,find(gt,gr,o).box));save();say("Amostra OK adicionada (localização automática por NCC).");R()}
async function readRef(i){const o=cur().rois[i];say("Lendo texto da referência (OCR)…");try{o.tx=(await ocr(refC,o)).trim().replace(/\s+/g," ");save();say("Texto lido. Confira e corrija se necessário.");R()}catch(e){say("OCR indisponível: conecte à internet para carregar o motor.")}}
function resetR(i){const o=cur().rois[i];o.ok=[feat(refC,o.x,o.y,o.w,o.h)];o.no=[];o.ot=[];o.nt=[];save();R()}
function delRoi(i){cur().rois.splice(i,1);save();R()}
function delR(){S.recipes=S.recipes.filter(x=>x.id!=E);E=null;sel="";save();R()}
function rig(v){cur().th=v/100;$("#rl").textContent="Rigor: "+(v/100).toFixed(2)+" (menor = mais rígido)";save()}
function paintE(){const cv=$("#ec");if(!cv||!refC)return;cv.width=refC.width;cv.height=refC.height;let a=null;
const draw=(a,b)=>{const x=cv.getContext("2d"),W=cv.width,H=cv.height;x.drawImage(refC,0,0);x.lineWidth=Math.max(3,W/150);x.font=`bold ${Math.max(14,W/35)}px sans-serif`;x.strokeStyle=x.fillStyle="#f5c01a";cur().rois.forEach(o=>{x.strokeRect(o.x*W,o.y*H,o.w*W,o.h*H);x.fillText(o.n,o.x*W+4,o.y*H-5)});if(a&&b){x.strokeStyle="#fff";x.strokeRect(a[0]*W,a[1]*H,(b[0]-a[0])*W,(b[1]-a[1])*H)}};
const P=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]};
draw();cv.onpointerdown=e=>{a=P(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(a)draw(a,P(e))};
cv.onpointerup=e=>{if(!a)return;const b=P(e),x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(a[0]-b[0]),h=Math.abs(a[1]-b[1]);a=null;
if(w>.02&&h>.02){const r=cur();r.rois.push({n:"R"+(r.rois.length+1),x,y,w,h,ok:[feat(refC,x,y,w,h)],no:[],ot:[],nt:[],tp:"vis",tx:""});save()}R()}}
function vL(){const n={ok:0,no:0,inc:0};S.log.forEach(l=>n[l.f]++);
return `<div class="three" style="margin-bottom:10px"><div class="kp ok"><b>${n.ok}</b>conformes</div><div class="kp no"><b>${n.no}</b>não conformes</div><div class="kp wa"><b>${n.inc}</b>indeterminados</div></div>`+
S.log.map((l,k)=>`<div class="c row"><img src="${l.th}" width="56" height="42" style="object-fit:cover;border-radius:6px" alt=""><div style="flex:1"><b>${esc(l.n)}</b><div class="mu">${new Date(l.t).toLocaleString("pt-BR")}</div>${l.d?`<div style="font-size:.85rem">${esc(l.d)}</div>`:""}</div><span class="dot ${col(l.f)}"></span><button class="g" onclick="delL(${k})">✕</button></div>`).join("")+
(S.log.length?`<button class="g" style="width:100%" onclick="csv()">Mostrar CSV para copiar</button><textarea id="cs" rows="6" hidden></textarea>`:'<p class="mu">Nenhuma inspeção registrada ainda.</p>')}
function delL(k){S.log.splice(k,1);save();R()}
function csv(){const t=$("#cs");t.hidden=false;t.value="data_hora;receita;resultado;diagnostico\n"+S.log.map(l=>[new Date(l.t).toLocaleString("pt-BR"),l.n,{ok:"CONFORME",no:"NAO_CONFORME",inc:"INDETERMINADO"}[l.f],l.d].join(";")).join("\n");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}}
function vD(){const kb=Math.round(JSON.stringify(S).length/1024),nS=S.recipes.reduce((a,r)=>a+r.rois.reduce((b,o)=>b+Math.max(0,o.ok.length-1)+o.no.length,0),0);
return `<div class="c"><b>Dados armazenados neste aparelho</b><p class="mu">${S.recipes.length} modelos · ${S.log.length} inspeções registradas · ${nS} amostras de treinamento · aprox. ${kb} KB. Nada é enviado a servidores. Também é possível apagar item a item: ROI e aprendizado (Referências), modelo (Referências) e cada inspeção (Registro).</p></div>
<div class="c"><button class="g" style="width:100%" onclick="wipe('log')">Apagar registro de inspeções</button><button class="g" style="width:100%;margin-top:8px" onclick="wipe('train')">Apagar treinamento (amostras OK/NOK), mantendo referências e ROIs</button><button class="g" style="width:100%;margin-top:8px" onclick="wipe('models')">Apagar todos os modelos (referências, ROIs e treinamento)</button><button class="b" style="background:var(--no);color:#fff" onclick="wipe('all')">Apagar TUDO e limpar o cache do app</button></div>`}
async function wipe(w){const m={log:"Apagar todo o registro de inspeções?",train:"Apagar todas as amostras de treinamento (OK/NOK)? As referências e ROIs serão mantidas.",models:"Apagar TODOS os modelos (referências, ROIs e treinamento)?",all:"Apagar TODOS os dados e limpar o cache do app? Esta ação não pode ser desfeita."}[w];if(!confirm(m))return;
if(w=="log"||w=="all")S.log=[];if(w=="train")S.recipes.forEach(r=>r.rois.forEach(o=>{o.ok=o.ok.slice(0,1);o.no=[];o.ot=[];o.nt=[]}));if(w=="models"||w=="all"){S.recipes=[];sel="";E=null}
last=null;if(w=="all"){S={recipes:[],log:[]};try{localStorage.removeItem("kv");const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}catch(e){}}else save();say("Dados apagados.");R()}
function R(){clearInterval(bt);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==V));$("#app").innerHTML=V=="insp"?vI():V=="rec"?(E?vE():vR()):V=="dat"?vD():vL();if(V=="insp")paint();if(V=="rec"&&E)paintE()}
R();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
