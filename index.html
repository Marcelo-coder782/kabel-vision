<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3a3a3a">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kabel Vision · Inspeção por imagem</title>
<style>
:root{--bg:#f3f3f0;--cd:#fff;--tx:#1c1c1c;--mu:#6b6b6b;--bd:#d9d9d4;--ac:#f5c01a;--ok:#1f9d55;--no:#d93025;--wa:#e0a000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--cd:#272727;--tx:#f0f0ee;--mu:#a0a0a0;--bd:#3a3a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1b;--cd:#272727;--tx:#f0f0ee;--mu:#a0a0a0;--bd:#3a3a3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px}html.big{font-size:21px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#3a3a3a;color:#fff;padding:12px 14px;border-bottom:4px solid var(--ac);display:flex;align-items:center;gap:8px}
header b{color:var(--ac);letter-spacing:.05em}header span{flex:1;color:#ccc;font-size:.85rem}
main{max-width:760px;margin:0 auto;padding:12px}
nav{display:flex;gap:6px;margin-bottom:10px}
nav button{flex:1;padding:.7em;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font-weight:600;font-size:.95rem}
nav button.on{background:var(--ac);color:#1c1c1c;border-color:var(--ac)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row input{flex:1;min-width:0}
.mu{color:var(--mu);font-size:.85rem}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:4px}
input:not([type=range]):not([type=file]),select,textarea{width:100%;padding:.65em;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
input[type=range]{width:100%}
.b,.g{display:block;width:100%;border-radius:10px;padding:.8em 1em;font-weight:700;font-size:1rem;text-align:center;cursor:pointer;color:var(--tx)}
.b{background:var(--ac);color:#1c1c1c;border:0;margin-top:8px}
.g{background:transparent;border:1px solid var(--bd);margin:0}
.row .g,header .g{width:auto;padding:.45em .8em;color:inherit}
canvas{width:100%;height:auto;border-radius:8px;display:block;margin:8px 0}
.rs{font-size:1.5rem;font-weight:800;text-align:center;padding:.5em;border-radius:10px;color:#fff;margin-bottom:6px}
.rs.ok{background:var(--ok)}.rs.no{background:var(--no)}.rs.wa{background:var(--wa);color:#1c1c1c}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.dot.ok{background:var(--ok)}.dot.no{background:var(--no)}.dot.wa{background:var(--wa)}
.two,.three{display:grid;gap:8px;margin-top:8px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.kp{border-radius:10px;padding:10px;text-align:center;font-size:.8rem;color:#fff}.kp b{display:block;font-size:1.6rem}
.kp.ok{background:var(--ok)}.kp.no{background:var(--no)}.kp.wa{background:var(--wa);color:#1c1c1c}
.it{border:1px solid var(--bd);border-left:6px solid var(--no);border-radius:10px;padding:10px;margin:8px 0}.it.wa{border-left-color:var(--wa)}
.nm{font-weight:700}.ac{font-weight:600;margin-top:4px}.cmp{display:flex;gap:10px;margin-top:8px}.cmp figure{margin:0;text-align:center;font-size:.75rem;color:var(--mu)}
.cmp img{max-width:100%;max-height:110px;border-radius:6px;border:2px solid var(--bd);display:block;margin-bottom:2px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--bd);vertical-align:-2px;margin:0 3px}
.gal{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.th{width:48px;height:48px;object-fit:cover;border-radius:6px;border:3px solid var(--bd)}
summary{cursor:pointer;font-weight:600}
</style></head><body>
<header><b>KABEL</b> Vision <span>inspeção por imagem</span><button class="g" onclick="document.documentElement.classList.toggle('big')" title="Modo texto grande">Aa</button></header>
<main>
<nav><button data-v="insp" onclick="go('insp')">Inspecionar</button><button data-v="rec" onclick="go('rec')">Referências</button><button data-v="log" onclick="go('log')">Registro</button></nav>
<div id="msg" class="mu"></div><div id="app"></div>
<p class="mu">Protótipo: o sinal ao WinTestEm é simulado nesta versão (o relé entra na fase do PC). Fotos e receitas ficam apenas neste aparelho.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let S={recipes:[],log:[]},V="insp",E=null,sel="",last=null,refC=null;
try{S=JSON.parse(localStorage.getItem("kv")||"null")||S}catch(e){}
const say=t=>{$("#msg").textContent=t};
const save=()=>{try{localStorage.setItem("kv",JSON.stringify(S))}catch(e){say("Memória do navegador cheia: apague registros ou receitas.")}};
const cur=()=>S.recipes.find(x=>x.id==E);
const go=v=>{V=v;E=null;say("");R()};
function load(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k|0;c.height=i.height*k|0;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c)};i.src=URL.createObjectURL(f)})}
function fromURL(u){return new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=i.width;c.height=i.height;c.getContext("2d").drawImage(i,0,0);r(c)};i.src=u})}
const T=document.createElement("canvas");T.width=T.height=6;const TX=T.getContext("2d",{willReadFrequently:true});TX.imageSmoothingQuality="high";
function feat(c,rx,ry,rw,rh,dx=0,dy=0){const W=c.width,H=c.height,w=rw*W,h=rh*H;let x=(rx+dx)*W,y=(ry+dy)*H;x=Math.max(0,Math.min(W-w,x));y=Math.max(0,Math.min(H-h,y));TX.drawImage(c,x,y,w,h,0,0,6,6);const d=TX.getImageData(0,0,6,6).data,v=[];let m=0;for(let i=0;i<d.length;i+=4){v.push(d[i],d[i+1],d[i+2]);m+=d[i]+d[i+1]+d[i+2]}m=m/v.length||1;return v.map(a=>+(a/m).toFixed(3))}
const dist=(a,b)=>a.reduce((s,v,i)=>s+Math.abs(v-b[i]),0)/a.length;
function judge(c,rec){return rec.rois.map(o=>{const fs=[];for(const dx of[-.02,0,.02])for(const dy of[-.02,0,.02])fs.push(feat(c,o.x,o.y,o.w,o.h,dx,dy));
const m=ss=>ss.length?Math.min(...fs.flatMap(f=>ss.map(s=>dist(f,s)))):9;
const ok=m(o.ok),no=m(o.no),th=rec.th;let s=ok<=th*.7?"ok":ok>th?"no":"inc";
if(no<ok)s="no";else if(s=="ok"&&no<ok*1.5)s="inc";return{n:o.n,ok,no,s}})}
function thumb(c){const t=document.createElement("canvas");t.width=84;t.height=63;t.getContext("2d").drawImage(c,0,0,84,63);return t.toDataURL("image/jpeg",.5)}
const col=s=>s=="ok"?"ok":s=="no"?"no":"wa";
const T2=document.createElement("canvas");T2.width=T2.height=12;const X2=T2.getContext("2d",{willReadFrequently:true});X2.imageSmoothingQuality="high";
function stats(c,o){X2.drawImage(c,o.x*c.width,o.y*c.height,o.w*c.width,o.h*c.height,0,0,12,12);const d=X2.getImageData(0,0,12,12).data;let r=0,g=0,b=0,L=[];for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];L.push(.3*d[i]+.59*d[i+1]+.11*d[i+2])}const n=L.length,m=L.reduce((a,v)=>a+v,0)/n;return{rgb:[r/n|0,g/n|0,b/n|0],sd:Math.sqrt(L.reduce((a,v)=>a+(v-m)*(v-m),0)/n)}}
function cname(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,v=mx/255,s=mx?d/mx:0;if(v<.2)return"preto";if(s<.2)return v>.8?"branco":"cinza";let h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;if(h<15||h>=345)return v<.5?"marrom":"vermelho";if(h<40)return v<.55?"marrom":"laranja";if(h<70)return"amarelo";if(h<165)return"verde";if(h<200)return"ciano";if(h<260)return"azul";if(h<300)return"roxo";return"rosa"}
function crop(c,o,m=120,q=.7){const w=o.w*c.width,h=o.h*c.height,k=Math.min(1,m/Math.max(w,h)),t=document.createElement("canvas");t.width=Math.max(1,w*k|0);t.height=Math.max(1,h*k|0);t.getContext("2d").drawImage(c,o.x*c.width,o.y*c.height,w,h,0,0,t.width,t.height);return t.toDataURL("image/jpeg",q)}
function learn(c,o,k){o[k].push(feat(c,o.x,o.y,o.w,o.h));const t=k=="ok"?"ot":"nt";(o[t]=o[t]||[]).push(crop(c,o,64,.6))}
function diag(c,rc,rec,res){return res.map((r,i)=>{const o=rec.rois[i],A=stats(rc,o),B=stats(c,o),cn=[cname(...A.rgb),cname(...B.rgb)],cd=Math.hypot(A.rgb[0]-B.rgb[0],A.rgb[1]-B.rgb[1],A.rgb[2]-B.rgb[2])/441;let t="Conforme",a="";
if(r.s!="ok"){if(cn[0]!=cn[1]&&cd>.12){t=`Cor diferente do esperado: esperado ${cn[0]}, encontrado ${cn[1]}`;a="Trocar pelo componente ou acessório da cor correta"}
else if(A.sd>8&&B.sd<A.sd*.55){t="Item possivelmente ausente: a região não mostra o detalhe esperado";a="Montar o item que está faltando"}
else if(r.no<r.ok){t="Parecido com um defeito já ensinado";a="Corrigir a montagem conforme a referência"}
else if(r.s=="no"){t="Aparência diferente da referência (item trocado, deslocado ou de outro tipo)";a="Conferir o tipo, a posição e o sentido do item"}
else{t="Resultado incerto, perto do limite de aprovação";a="Refazer a foto com boa luz; se persistir, chamar o supervisor"}}
return{...r,i,n:o.n,t,a,A,B,cn,ex:crop(rc,o),fo:crop(c,o)}})}
const sw=a=>`<span class="sw" style="background:rgb(${a.join(",")})"></span>`;
const cam=t=>`<label class="b" style="margin-top:10px">${t}<input type="file" accept="image/*" capture="environment" hidden onchange="insp(this)"></label>`;
function vI(){if(!sel&&S.recipes[0])sel=S.recipes[0].id;
const o=S.recipes.map(r=>`<option value="${r.id}"${r.id==sel?" selected":""}>${esc(r.name)} (${r.rois.length} regiões)</option>`).join("");
return `<div class="c"><label>Receita (código do chicote)</label><select onchange="sel=this.value">${o||'<option value="">Nenhuma receita criada</option>'}</select>${cam("📷 Fotografar e inspecionar")}</div>${last?resH():""}`}
function resH(){const L=last,bad=L.dg.filter(x=>x.s!="ok"),tx={ok:"APROVADO",no:"REPROVADO",inc:"INCONCLUSIVO · tratar como reprovado"}[L.f];
const dgH=bad.length?`<div class="c"><b>Diagnóstico: o que corrigir (${bad.length} ${bad.length>1?"itens":"item"})</b>${bad.map(x=>`<div class="it ${x.s=="no"?"":"wa"}"><div class="nm">${x.i+1}. ${esc(x.n)}</div><div>${x.t}</div><div class="mu">Esperado ${sw(x.A.rgb)}${x.cn[0]} · encontrado ${sw(x.B.rgb)}${x.cn[1]}</div><div class="ac">→ ${x.a}</div><div class="cmp"><figure><img src="${x.ex}" alt="">Esperado</figure><figure><img src="${x.fo}" alt="">Encontrado</figure></div></div>`).join("")}${cam("📷 Fotografar novamente após corrigir")}</div>`:`<div class="c"><b>Diagnóstico: nenhuma correção necessária</b><div class="mu">Todas as regiões estão conformes com a referência.</div></div>`;
return `<div class="c"><div class="rs ${col(L.f)}">${tx}</div><div class="mu">Sinal ao WinTestEm: <b>${L.f=="ok"?"LIBERADO":"BLOQUEADO"}</b></div></div>${dgH}<div class="c"><canvas id="cv"></canvas>${L.dg.map(x=>`<div class="row"><span class="dot ${col(x.s)}"></span><span style="flex:1">${x.i+1}. ${esc(x.n)} <span class="mu">${x.s=="ok"?"conforme":"divergente"}</span></span></div>`).join("")}</div>
<details class="c"><summary>Ensinar o sistema com esta foto</summary>${L.dg.map(x=>`<div class="row"><span style="flex:1">${x.i+1}. ${esc(x.n)}</span><button class="g" onclick="teach('ok',${x.i})">É OK</button><button class="g" onclick="teach('no',${x.i})">É NOK</button></div>`).join("")}<button class="g" style="width:100%;margin-top:8px" onclick="teach('ok')">Todas as regiões estão OK</button></details>`}
async function insp(i){const f=i.files[0];i.value="";if(!f)return;const r=S.recipes.find(x=>x.id==sel);
if(!r||!r.rois.length){say("Selecione uma receita que tenha regiões marcadas.");return}
const c=await load(f),rc=await fromURL(r.ref),res=judge(c,r),dg=diag(c,rc,r,res),fin=res.some(x=>x.s=="no")?"no":res.some(x=>x.s=="inc")?"inc":"ok";
last={c,r,res,dg,f:fin};S.log.unshift({t:Date.now(),n:r.name,f:fin,th:thumb(c),d:dg.filter(x=>x.s!="ok").map(x=>x.n+": "+x.t).join("; ")});S.log=S.log.slice(0,80);save();say("");R();scrollTo(0,0)}
function teach(k,i){if(!last)return;last.r.rois.forEach((o,j)=>{if(i===undefined||i===j)learn(last.c,o,k)});save();say("Aprendido como "+(k=="ok"?"OK":"NOK")+". Fotografe de novo para conferir.")}
function paint(){const cv=$("#cv");if(!cv||!last)return;const c=last.c;cv.width=c.width;cv.height=c.height;const x=cv.getContext("2d");x.drawImage(c,0,0);x.lineWidth=Math.max(3,c.width/150);x.font=`bold ${Math.max(14,c.width/35)}px sans-serif`;
last.r.rois.forEach((o,i)=>{x.strokeStyle=x.fillStyle={ok:"#1f9d55",no:"#d93025",inc:"#e0a000"}[last.res[i].s];x.strokeRect(o.x*c.width,o.y*c.height,o.w*c.width,o.h*c.height);x.fillText((i+1)+" "+o.n,o.x*c.width+4,o.y*c.height-5)})}
function vR(){return `<div class="c"><label>Nova receita (código do chicote)</label><input id="nm" placeholder="Ex.: CAT-1234"><button class="b" onclick="newR()">Criar receita</button></div>`+
S.recipes.map(r=>`<div class="c row"><b style="flex:1">${esc(r.name)}</b><span class="mu">${r.rois.length} regiões</span><button class="g" onclick="edit('${r.id}')">Editar</button></div>`).join("")}
function newR(){const n=$("#nm").value.trim();if(!n){say("Informe o código do chicote.");return}const r={id:Date.now().toString(36),name:n,ref:null,rois:[],th:.1};S.recipes.push(r);sel=r.id;save();edit(r.id)}
async function edit(id){E=id;refC=null;const r=cur();if(r.ref)refC=await fromURL(r.ref);R()}
function vE(){const r=cur();
const gal=(o)=>`<div class="gal"><img class="th" style="border-color:var(--ac)" src="${crop(refC,o,64,.6)}" alt="">${(o.ot||[]).map(u=>`<img class="th" style="border-color:var(--ok)" src="${u}" alt="">`).join("")}${(o.nt||[]).map(u=>`<img class="th" style="border-color:var(--no)" src="${u}" alt="">`).join("")}</div>`;
return `<div class="c"><div class="row"><b style="flex:1">${esc(r.name)}</b><button class="g" onclick="E=null;R()">Voltar</button></div>
<label class="b">${r.ref?"🔄 Trocar foto de referência":"📷 Foto de referência (montagem correta)"}<input type="file" accept="image/*" capture="environment" hidden onchange="setRef(this)"></label>
${r.ref?`<p class="mu">Arraste sobre a foto para marcar cada região a verificar. Use nomes claros, como Conector principal ou Fusível F12.</p><canvas id="ec" style="touch-action:none"></canvas>`:""}</div>
${r.ref?`<div class="c"><b>Referências aprendidas</b><p class="mu">O que o sistema já sabe de cada região. Amarelo = referência, verde = exemplo aprovado, vermelho = defeito ensinado.</p>
${r.rois.map((o,i)=>{const s=stats(refC,o);return `<div class="it" style="border-left-color:var(--ac)"><div class="row"><input value="${esc(o.n)}" onchange="cur().rois[${i}].n=this.value;save()"><button class="g" onclick="delRoi(${i})">✕</button></div><div class="mu">Cor esperada ${sw(s.rgb)}${cname(...s.rgb)} · ${o.ok.length} OK · ${o.no.length} NOK</div>${gal(o)}<button class="g" style="margin-top:6px" onclick="resetR(${i})">Limpar aprendizado</button></div>`}).join("")||'<p class="mu">Nenhuma região marcada ainda.</p>'}
<div class="two"><label class="g">＋ Foto OK<input type="file" accept="image/*" capture="environment" hidden onchange="addS(this,'ok')"></label><label class="g">＋ Foto NOK<input type="file" accept="image/*" capture="environment" hidden onchange="addS(this,'no')"></label></div>
<label id="rl" style="margin-top:8px">Rigor: ${r.th.toFixed(2)} (menor = mais rígido)</label><input type="range" min="3" max="25" value="${Math.round(r.th*100)}" oninput="rig(this.value)"></div>`:""}
<button class="g" style="width:100%;color:var(--no)" onclick="delR()">Excluir receita</button>`}
async function setRef(i){const f=i.files[0];i.value="";if(!f)return;const c=await load(f),r=cur();refC=c;r.ref=c.toDataURL("image/jpeg",.8);r.rois.forEach(o=>{o.ok=[feat(c,o.x,o.y,o.w,o.h)];o.no=[];o.ot=[];o.nt=[]});save();R()}
async function addS(i,k){const f=i.files[0];i.value="";if(!f)return;const c=await load(f);cur().rois.forEach(o=>learn(c,o,k));save();say("Foto "+(k=="ok"?"OK":"NOK")+" aprendida.");R()}
function resetR(i){const o=cur().rois[i];o.ok=[feat(refC,o.x,o.y,o.w,o.h)];o.no=[];o.ot=[];o.nt=[];save();R()}
function delRoi(i){cur().rois.splice(i,1);save();R()}
function delR(){S.recipes=S.recipes.filter(x=>x.id!=E);E=null;sel="";save();R()}
function rig(v){cur().th=v/100;$("#rl").textContent="Rigor: "+(v/100).toFixed(2)+" (menor = mais rígido)";save()}
function paintE(){const cv=$("#ec");if(!cv||!refC)return;cv.width=refC.width;cv.height=refC.height;let a=null;
const draw=(a,b)=>{const x=cv.getContext("2d"),W=cv.width,H=cv.height;x.drawImage(refC,0,0);x.lineWidth=Math.max(3,W/150);x.font=`bold ${Math.max(14,W/35)}px sans-serif`;x.strokeStyle=x.fillStyle="#f5c01a";cur().rois.forEach(o=>{x.strokeRect(o.x*W,o.y*H,o.w*W,o.h*H);x.fillText(o.n,o.x*W+4,o.y*H-5)});if(a&&b){x.strokeStyle="#fff";x.strokeRect(a[0]*W,a[1]*H,(b[0]-a[0])*W,(b[1]-a[1])*H)}};
const P=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]};
draw();cv.onpointerdown=e=>{a=P(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(a)draw(a,P(e))};
cv.onpointerup=e=>{if(!a)return;const b=P(e),x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(a[0]-b[0]),h=Math.abs(a[1]-b[1]);a=null;
if(w>.02&&h>.02){const r=cur();r.rois.push({n:"R"+(r.rois.length+1),x,y,w,h,ok:[feat(refC,x,y,w,h)],no:[],ot:[],nt:[]});save()}R()}}
function vL(){const n={ok:0,no:0,inc:0};S.log.forEach(l=>n[l.f]++);
return `<div class="three" style="margin-bottom:10px"><div class="kp ok"><b>${n.ok}</b>aprovadas</div><div class="kp no"><b>${n.no}</b>reprovadas</div><div class="kp wa"><b>${n.inc}</b>inconclusivas</div></div>`+
S.log.map(l=>`<div class="c row"><img src="${l.th}" width="56" height="42" style="object-fit:cover;border-radius:6px" alt=""><div style="flex:1"><b>${esc(l.n)}</b><div class="mu">${new Date(l.t).toLocaleString("pt-BR")}</div>${l.d?`<div style="font-size:.85rem">${esc(l.d)}</div>`:""}</div><span class="dot ${col(l.f)}"></span></div>`).join("")+
(S.log.length?`<button class="g" style="width:100%" onclick="csv()">Mostrar CSV para copiar</button><textarea id="cs" rows="6" hidden></textarea>`:'<p class="mu">Nenhuma inspeção registrada ainda.</p>')}
